
<h1>Algorithm Visualizer</h1>

<button (click)="generateArray()" [disabled]="isRunning">New Array</button>

<select (change)="onAlgorithmChange($any($event.target).value)" [disabled]="isRunning">
  <option value="bubble">Bubble Sort</option>
  <option value="selection">Selection Sort</option>
  <option value="insertion">Insertion Sort</option>
</select>

<button (click)="run()" [disabled]="isRunning">Start</button>

<div class="controls">
  <label>
    Size: {{arraySize}}
    <input type="range" min="10" max="100" [value]="arraySize" (input)="onSizeChange($any($event.target).value)" [disabled]="isRunning"/>
  </label>

  <label>
    Speed
    <input type="range" min="1" max="100" [value]="101 - speed" (input)="onSpeedChange($any($event.target).value)"/>
  </label>
</div>

<div class="bars">
  @for (value of array; track $index){

    <div class="bar" 
    [class.comparing]="comparing.includes($index)"
    [class.swapping]="swapping.includes($index)"
    [style.height.px]="value"

    ></div>
  }

</div>




          


<router-outlet />
